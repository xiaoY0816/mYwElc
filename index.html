<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SYSTEM_ACCESS</title>
    <style>
        /* 引入自定义字体 */
        @font-face {
            font-family: 'MyHorrorFont';
            src: url('font.ttf') format('truetype'); 
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: #050505; /* 纯黑背景 */
            color: #00ff00; /* 终端绿字 */
            font-family: 'MyHorrorFont', 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
            font-size: 20px;
            cursor: default;
        }

        /* 终端容器 */
        #terminal {
            padding: 50px;
            line-height: 2;
        }

        /* 输入框样式，伪装成终端光标 */
        input {
            background: transparent;
            border: none;
            outline: none;
            color: #00ff00;
            font-family: inherit;
            font-size: inherit;
            caret-color: #00ff00;
            width: 250px;
        }

        /* 报错提示，默认隐藏 */
        #error-msg {
            display: none;
            color: #ff0000; /* 红色报错 */
            margin-top: 10px;
            text-shadow: 1px 1px 2px rgba(255,0,0,0.5);
        }

        /* 密码行默认隐藏 */
        #password-line {
            display: none;
        }

        /* 最终的黑屏容器 */
        #black-screen {
            display: none;
            height: 100vh;
            width: 100vw;
            background-color: #000;
        }
    </style>
</head>
<body>

    <!-- 终端界面 -->
    <div id="terminal">
        <div id="username-line">
            <span>USER > </span>
            <input type="text" id="username" autocomplete="off" autofocus spellcheck="false">
        </div>
        
        <div id="password-line">
            <span>PASS > </span>
            <input type="password" id="password" autocomplete="off" spellcheck="false">
        </div>

        <div id="error-msg"></div>
    </div>

    <!-- 最终黑屏界面 -->
    <div id="black-screen"></div>

    <!-- 你的慢扫描音频 -->
    <audio id="sstv-audio" src="4109.mp3" preload="auto"></audio>

    <script>
        const userLine = document.getElementById('username-line');
        const passLine = document.getElementById('password-line');
        const userInput = document.getElementById('username');
        const passInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-msg');
        const terminal = document.getElementById('terminal');
        const blackScreen = document.getElementById('black-screen');
        const audio = document.getElementById('sstv-audio');

        // 正确的账号密码
        const CORRECT_USER = "mYwElc";
        const CORRECT_PASS = "LlsErl1017";

        // 监听用户名回车
        userInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const val = userInput.value;
                if (val === CORRECT_USER) {
                    // 验证成功，进入密码阶段
                    errorMsg.style.display = 'none';
                    userLine.style.display = 'none';
                    passLine.style.display = 'block';
                    passInput.focus();
                } else {
                    // 验证失败
                    errorMsg.textContent = "INVALID USERNAME. ACCESS DENIED.";
                    errorMsg.style.display = 'block';
                    userInput.value = ''; // 清空输入框
                }
            }
        });

        // 监听密码回车
        passInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const val = passInput.value;
                if (val === CORRECT_PASS) {
                    // 密码正确，进入黑屏阶段
                    terminal.style.display = 'none';
                    blackScreen.style.display = 'block';
                    
                    // 延迟 3 秒后播放音频（制造压抑的等待感）
                    setTimeout(function() {
                        audio.play().catch(e => console.log("播放被拦截", e));
                    }, 3000); 
                } else {
                    // 密码错误
                    errorMsg.textContent = "INVALID PASSWORD. ACCESS DENIED.";
                    errorMsg.style.display = 'block';
                    passInput.value = '';
                }
            }
        });
    </script>
</body>
</html>
